server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old chunks.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: the app uses BrowserRouter, so a deep link such as
    # /register has no file on disk and must still serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
